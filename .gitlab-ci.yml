stages:
  - build
  - deploy

image: node:18

# This folder is cached between builds
# http://docs.gitlab.com/ce/ci/yaml/README.html#cache
cache:
  key: npm-cache
  paths:
    - node_modules/

build-to-pre-release:
  stage: build
  tags:
    - Frontend
  script:
    - yarn --registry="https://registry.npmmirror.com/"
    - yarn build
  artifacts:
    expire_in: 1 week
    name: '$CI_JOB_NAME'
    paths:
      - dist
  rules:
    - if: '$CI_PROJECT_NAMESPACE == $NAMESPACE && $CI_COMMIT_BRANCH == "pre-release"'
      when: on_success
    - when: never

deploy-to-pre-release:
  stage: deploy
  tags:
    - Frontend
  dependencies:
    - build-to-pre-release
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$PRE_RELEASE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - mkdir -p ./$CI_PROJECT_NAMESPACE/web
    - cp -r dist/* ./$CI_PROJECT_NAMESPACE/web
    - scp -r ./$CI_PROJECT_NAMESPACE $PRE_RELEASE_USER@$PRE_RELEASE_HOST:~
    - yarn ossPre
  rules:
    - if: '$CI_PROJECT_NAMESPACE == $NAMESPACE && $CI_COMMIT_BRANCH == "pre-release"'
      when: on_success
    - when: never

build-to-test:
  stage: build
  tags:
    - Frontend
  script:
    - yarn --registry="https://registry.npmmirror.com/"
    - yarn test
  artifacts:
    expire_in: 1 week
    name: '$CI_JOB_NAME'
    paths:
      - test
  rules:
    - if: '$CI_PROJECT_NAMESPACE == $NAMESPACE && $CI_COMMIT_BRANCH == "pre-release" '
      when: never
    - if: '$CI_PROJECT_NAMESPACE == $NAMESPACE && $CI_COMMIT_REF_NAME =~ /^v(\d+\.){2}\d+$/'
      when: never
    - when: on_success

deploy-to-test:
  stage: deploy
  tags:
    - Frontend
  dependencies:
    - build-to-test
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$TEST_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - mkdir -p ./$CI_PROJECT_NAMESPACE/web
    - cp -r test/* ./$CI_PROJECT_NAMESPACE/web
    - scp -r ./$CI_PROJECT_NAMESPACE $TEST_USER@$TEST_HOST:~
  rules:
    - if: '$CI_PROJECT_NAMESPACE == $NAMESPACE && $CI_COMMIT_BRANCH == "pre-release" '
      when: never
    - if: '$CI_PROJECT_NAMESPACE == $NAMESPACE && $CI_COMMIT_REF_NAME =~ /^v(\d+\.){2}\d+$/'
      when: never
    - when: manual
      allow_failure: true


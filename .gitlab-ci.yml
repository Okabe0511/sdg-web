    - eval $(ssh-agent -s)
    - echo "$PROD_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - mkdir -p ./$CI_PROJECT_NAMESPACE/web
    - cp -r release/* ./$CI_PROJECT_NAMESPACE/web
    - scp -r ./$CI_PROJECT_NAMESPACE $PROD_USER@$PROD_HOST:~
    - yarn oss
  rules:
    - if: '$CI_PROJECT_NAMESPACE == $NAMESPACE && $CI_COMMIT_REF_NAME =~ /^v(\d+\.){2}\d+$/'
